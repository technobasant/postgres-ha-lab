---
- name: Install PGDG repository RPM
  ansible.builtin.dnf:
    name: "{{ pgdg_repo_rpm }}"
    state: present
    disable_gpg_check: true

- name: Disable PGDG module conflict on RHEL 8 (if present)
  ansible.builtin.command: dnf -qy module disable postgresql
  register: pg_module_disable
  changed_when: false
  failed_when: false

- name: Install latest stable pgBackRest
  ansible.builtin.dnf:
    name: "{{ pgbackrest_pkg }}"
    state: latest

- name: Record installed pgBackRest version
  ansible.builtin.command: pgbackrest version
  register: pgbackrest_version_cmd
  changed_when: false

- name: Show pgBackRest version
  ansible.builtin.debug:
    msg: "{{ pgbackrest_version_cmd.stdout }}"

- name: Ensure pgbackrest system user
  ansible.builtin.user:
    name: "{{ pgbackrest_user }}"
    system: true
    shell: /bin/bash
    home: /var/lib/{{ pgbackrest_user }}
    create_home: true

- name: Ensure pgBackRest directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ pgbackrest_user }}"
    group: "{{ pgbackrest_group }}"
    mode: "0750"
  loop:
    - "{{ pgbackrest_conf_dir }}"
    - "{{ pgbackrest_repo_path }}"
    - "{{ pgbackrest_log_path }}"
    - "{{ pgbackrest_cert_dir }}"

- name: Allow sudo for pgbackrest where needed
  ansible.builtin.copy:
    dest: /etc/sudoers.d/pgbackrest
    mode: "0440"
    content: |
      {{ pgbackrest_user }} ALL=(root) NOPASSWD: /usr/bin/pgbackrest
    validate: "visudo -cf %s"
