# /etc/patroni/patroni.yml on pgn2.
# Lab credentials (replpass / pgpass) are throwaway defaults: change them for anything real.
scope: pg18lab
name: pgn2

restapi:
  listen: 192.168.105.142:8008
  connect_address: 192.168.105.142:8008

etcd3:
  hosts: 192.168.105.140:2379

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    postgresql:
      use_pg_rewind: true
      parameters:
        wal_level: replica
        max_wal_senders: 10
        max_replication_slots: 10
  pg_hba:
    - host replication replicator 192.168.105.0/24 scram-sha-256
    - host all all 192.168.105.0/24 scram-sha-256
    - local all all peer

postgresql:
  listen: 192.168.105.142:5432
  connect_address: 192.168.105.142:5432
  data_dir: /var/lib/pgsql/18/data
  bin_dir: /usr/pgsql-18/bin
  authentication:
    replication: { username: replicator, password: replpass }
    superuser:   { username: postgres,   password: pgpass }
